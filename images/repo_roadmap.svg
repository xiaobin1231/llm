  <rect x="30" y="96" width="360" height="28" rx="4" fill="url(#file_impl)" stroke="#30363d" stroke-width="0.8"/>
  <text x="42" y="115" fill="#c9d1d9" font-size="12">flash_attention_cpu_naive_impl.cc</text>

  <rect x="30" y="132" width="360" height="28" rx="4" fill="url(#file_impl)" stroke="#30363d" stroke-width="0.8"/>
