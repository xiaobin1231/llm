  <rect x="30" y="168" width="360" height="28" rx="4" fill="url(#file_impl)" stroke="#30363d" stroke-width="0.8"/>
  <text x="42" y="187" fill="#c9d1d9" font-size="12">flash_attention_v2_naive_impl.cu</text>

  <rect x="30" y="204" width="360" height="28" rx="4" fill="url(#file_impl)" stroke="#30363d" stroke-width="0.8"/>
