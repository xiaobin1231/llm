  <text x="30" y="254" fill="#58a6ff" font-size="11" font-family="system-ui, sans-serif">CPU naive → V1 tiling → V2 online softmax</text>
  <text x="30" y="270" fill="#58a6ff" font-size="11" font-family="system-ui, sans-serif">→ V2 perf: warp-level reduction, cp.async, vectorized loads</text>

