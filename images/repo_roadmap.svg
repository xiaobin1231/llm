  <rect width="800" height="540" fill="url(#bg)" rx="8"/>

  <text x="400" y="32" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Project Structure</text>

  <!-- ======================== flash_attn ======================== -->
  <rect x="30" y="52" width="360" height="32" rx="5" fill="url(#dir_fa)" filter="url(#shadow)"/>
